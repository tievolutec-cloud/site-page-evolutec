<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mundo das Letras e Sílabas</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#eef7ff,#fff8ea);color:#24324a}.box{text-align:center;padding:30px}.emoji{font-size:64px}.msg{font-size:20px;font-weight:800;margin-top:12px}</style></head><body><div class="box"><div class="emoji">🦄📚</div><div class="msg">Carregando o Mundo das Letras...</div></div><script>(async()=>{try{const parts=await Promise.all([1,2,3,4,5,6].map(n=>fetch(`part-0${n}.txt?v=3`).then(r=>{if(!r.ok)throw new Error('Falha ao carregar');return r.text()})));const html=parts.join('');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="box"><div class="emoji">📚</div><div class="msg">Não foi possível carregar o jogo. Atualize a página e tente novamente.</div></div>'}})();</script></body></html>
